name: Slice 2 verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Frontend tests
        run: npm test
      - name: Frontend production build
        run: npm run build:frontend
      - name: Rust tests and lockfile resolution
        run: cargo test --manifest-path .\src-tauri\Cargo.toml
      - name: Format Rust sources
        if: always()
        run: cargo fmt --manifest-path .\src-tauri\Cargo.toml
      - name: Upload resolved native files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice2-native-output
          path: |
            src-tauri/Cargo.lock
            src-tauri/src/*.rs
          retention-days: 1
      - name: Require committed native files
        if: always()
        run: git diff --exit-code -- src-tauri
